    function initCanvasGraph() {
      updateSimulation();

    function updateSimulation() {
      const sliderI = document.getElementById("sliderIncome");
      if (!sliderI) return;

      simIncome = parseFloat(sliderI.value);
      simPx = parseFloat(document.getElementById("sliderPx").value);
      simPy = parseFloat(document.getElementById("sliderPy").value);

      document.getElementById("valIncome").textContent = `$${simIncome.toFixed(0)}`;
      document.getElementById("valPx").textContent = `$${simPx.toFixed(2)}`;
      document.getElementById("valPy").textContent = `$${simPy.toFixed(2)}`;

      const optX = (0.5 * simIncome) / simPx;
      const optY = (0.5 * simIncome) / simPy;
      const optU = Math.sqrt(optX * optY);

      const xInt = simIncome / simPx;
      const yInt = simIncome / simPy;
      const slope = -(simPx / simPy);

      document.getElementById("calcSlope").textContent = slope.toFixed(2);
      document.getElementById("calcXInt").textContent = `${xInt.toFixed(1)} units`;
      document.getElementById("calcYInt").textContent = `${yInt.toFixed(1)} units`;
      document.getElementById("calcOptimum").textContent = `(${optX.toFixed(1)}, ${optY.toFixed(1)})`;
      document.getElementById("calcUtility").textContent = `${optU.toFixed(2)} utils`;

      drawGraph(xInt, yInt, optX, optY, optU);
    }

    function resetSliders() {
      document.getElementById("sliderIncome").value = 30;
      document.getElementById("sliderPx").value = 1.5;
      document.getElementById("sliderPy").value = 3.0;
      updateSimulation();
    }

    function drawGraph(xInt, yInt, optX, optY, optU) {
      const canvas = document.getElementById("econCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;

      ctx.clearRect(0, 0, W, H);

      const padL = 50, padB = 40, padT = 20, padR = 20;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const maxAxisX = 40;
      const maxAxisY = 25;

      const toX = (val) => padL + (val / maxAxisX) * plotW;
      const toY = (val) => (H - padB) - (val / maxAxisY) * plotH;

      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 1;
      for (let x = 5; x <= maxAxisX; x += 5) {
        ctx.beginPath();
        ctx.moveTo(toX(x), toY(0));
        ctx.lineTo(toX(x), toY(maxAxisY));
        ctx.stroke();
      }
      for (let y = 5; y <= maxAxisY; y += 5) {
        ctx.beginPath();
        ctx.moveTo(toX(0), toY(y));
        ctx.lineTo(toX(maxAxisX), toY(y));
        ctx.stroke();
      }

      ctx.strokeStyle = "#475569";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(padL, padT);
      ctx.lineTo(padL, H - padB);
      ctx.lineTo(W - padR, H - padB);
      ctx.stroke();

      ctx.fillStyle = "#334155";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText("Quantity of Good X", W / 2 - 40, H - 10);
      ctx.save();
      ctx.translate(15, H / 2 + 30);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText("Quantity of Good Y", 0, 0);
      ctx.restore();

      ctx.strokeStyle = "#2563eb";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(toX(0), toY(yInt));
      ctx.lineTo(toX(xInt), toY(0));
      ctx.stroke();

      ctx.strokeStyle = "#10b981";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      const uSq = optU * optU;
      let first = true;
      for (let x = 1; x <= maxAxisX; x += 0.5) {
        const y = uSq / x;
        if (y <= maxAxisY + 2) {
          const px = toX(x);
          const py = toY(y);
          if (first) {
            ctx.moveTo(px, py);
            first = false;
          } else {
            ctx.lineTo(px, py);
          }
        }
      }
      ctx.stroke();

      ctx.fillStyle = "#e11d48";
      ctx.beginPath();
      ctx.arc(toX(optX), toY(optY), 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(toX(optX), toY(0));
      ctx.lineTo(toX(optX), toY(optY));
      ctx.lineTo(toX(0), toY(optY));
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#0f172a";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText(`Optimum (${optX.toFixed(1)}, ${optY.toFixed(1)})`, toX(optX) + 8, toY(optY) - 8);
    }

                      return `
                        <button onclick="handleAnswer(${qIndex}, ${optIndex})" ${isAnswered ? "disabled" : ""} class="w-full text-left p-3.5 rounded-lg border text-sm flex items-center transition-all ${btnStyle}">
                          <span class="w-6 h-6 rounded-full border border-current flex items-center justify-center text-xs mr-3 flex-shrink-0">
                            ${String.fromCharCode(65 + optIndex)}
                          </span>
                          <span class="flex-1">${opt}</span>
                          ${indicator}
                        </button>
                      `;
                    }).join("")}
                  </div>

                  <!-- Feedback Box -->
                  ${isAnswered ? `
                    <div class="mt-4 p-4 rounded-lg bg-slate-50 border border-slate-200 text-xs text-slate-700 leading-relaxed">
                      <span class="font-bold block text-slate-900 mb-1">
                        <i class="fa-solid fa-circle-info text-brand-500 mr-1"></i> Solution Explanation:
                      </span>
                      ${q.explanation}
                    </div>
                  ` : ""}
                </div>
              `;
            }).join("")}
          </div>

          <div class="flex justify-between items-center py-4">
            <button onclick="resetQuiz()" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-xl text-xs font-semibold transition">
              <i class="fa-solid fa-rotate-left mr-1.5"></i> Reset Current Exam
            </button>
            <button onclick="nextExamSet()" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-semibold shadow-md transition">
              Next Exam Set <i class="fa-solid fa-arrow-right ml-1.5"></i>
            </button>
          </div>
        </div>
      `;
    }

    function switchQuizSet(index) {
      activeQuizSetIndex = parseInt(index);
      userQuizAnswers = {};
      renderContent();
    }

    function nextExamSet() {
      const chap = getCurrentChapter();
      activeQuizSetIndex = (activeQuizSetIndex + 1) % chap.quizSets.length;
      userQuizAnswers = {};
      renderContent();
    }

    function handleAnswer(questionIdx, optionIdx) {
      userQuizAnswers[questionIdx] = optionIdx;
      renderContent();
    }

    function resetQuiz() {
      userQuizAnswers = {};
      renderContent();
    }

    /* ==========================================================================
       GLOBAL REAL-TIME SEARCH
       ========================================================================== */
    function handleSearch(term) {
      const resultsContainer = document.getElementById("searchResults");
      const cleanTerm = term.trim().toLowerCase();

      if (!cleanTerm) {
        resultsContainer.classList.add("hidden");
        return;
      }

      let matches = [];
      courseData.chapters.forEach(ch => {
        // Search in Flashcards
        ch.flashcards.forEach(fc => {
          if (fc.front.toLowerCase().includes(cleanTerm) || fc.back.toLowerCase().includes(cleanTerm)) {
            matches.push({
              chapterId: ch.id,
              chapterName: ch.number,
              title: fc.front,
              desc: fc.back,
              type: "Flashcard"
            });
          }
        });
        // Search in Study Guide
        ch.studyGuide.forEach(sg => {
          sg.subSections.forEach(sub => {
            if (sub.subtitle.toLowerCase().includes(cleanTerm) || sub.details.some(d => d.toLowerCase().includes(cleanTerm))) {
              matches.push({
                chapterId: ch.id,
                chapterName: ch.number,
                title: sub.subtitle,
                desc: sub.details[0],
                type: "Study Guide"
              });
            }
          });
        });
      });

      if (matches.length === 0) {
        resultsContainer.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">No matching concepts found.</div>`;
      } else {
        resultsContainer.innerHTML = matches.map(m => `
          <div onclick="selectSearchResult('${m.chapterId}')" class="p-2.5 hover:bg-slate-100 rounded-lg cursor-pointer transition">
            <div class="flex items-center justify-between text-[10px] text-slate-400 font-semibold mb-1">
              <span>${m.chapterName} • ${m.type}</span>
            </div>
            <div class="font-bold text-xs text-slate-800">${m.title}</div>
            <div class="text-[11px] text-slate-500 truncate">${m.desc}</div>
          </div>
        `).join("");
      }
      resultsContainer.classList.remove("hidden");
    }

    function selectSearchResult(chapterId) {
      switchChapter(chapterId);
      document.getElementById("searchResults").classList.add("hidden");
      document.getElementById("searchInput").value = "";
    }
  </script>
</body>
</html>
